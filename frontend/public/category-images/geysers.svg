<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="body" x1="140" y1="60" x2="260" y2="260">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="water" x1="160" y1="160" x2="240" y2="250">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="heat" x1="180" y1="80" x2="220" y2="120">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Geyser body -->
  <rect x="150" y="60" width="100" height="180" rx="20" fill="url(#body)" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Top cap -->
  <rect x="145" y="50" width="110" height="20" rx="10" fill="#64748b"/>
  
  <!-- Pipe top -->
  <rect x="185" y="30" width="30" height="25" rx="4" fill="#94a3b8"/>
  <circle cx="200" cy="28" r="8" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Pipe bottom -->
  <rect x="185" y="235" width="30" height="25" rx="4" fill="#94a3b8"/>
  
  <!-- Water level indicator -->
  <rect x="158" y="160" width="84" height="72" rx="8" fill="url(#water)" opacity="0.8"/>
  
  <!-- Temperature display -->
  <rect x="170" y="90" width="60" height="30" rx="6" fill="#1e293b"/>
  <text x="200" y="111" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#22d3ee">75°C</text>
  
  <!-- Heat waves -->
  <path d="M175 75 C175 65, 185 65, 185 55" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M195 72 C195 60, 205 60, 205 48" stroke="#f97316" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M215 75 C215 65, 225 65, 225 55" stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Brand indicator dot -->
  <circle cx="200" cy="145" r="4" fill="#22c55e"/>
  
  <!-- Shadow -->
  <ellipse cx="200" cy="265" rx="60" ry="8" fill="#94a3b8" opacity="0.2"/>
</svg>