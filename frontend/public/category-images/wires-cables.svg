<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- Wire coils -->
  <ellipse cx="300" cy="300" rx="120" ry="160" fill="none" stroke="#dc3545" stroke-width="8" opacity="0.8"/>
  <ellipse cx="300" cy="300" rx="90" ry="130" fill="none" stroke="#dc3545" stroke-width="6" opacity="0.5"/>
  <ellipse cx="300" cy="300" rx="60" ry="100" fill="none" stroke="#dc3545" stroke-width="4" opacity="0.3"/>
  <ellipse cx="500" cy="300" rx="120" ry="160" fill="none" stroke="#1a73e8" stroke-width="8" opacity="0.8"/>
  <ellipse cx="500" cy="300" rx="90" ry="130" fill="none" stroke="#1a73e8" stroke-width="6" opacity="0.5"/>
  <ellipse cx="500" cy="300" rx="60" ry="100" fill="none" stroke="#1a73e8" stroke-width="4" opacity="0.3"/>
  <!-- Wire ends -->
  <line x1="420" y1="140" x2="480" y2="140" stroke="#1a73e8" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="140" x2="240" y2="140" stroke="#dc3545" stroke-width="8" stroke-linecap="round"/>
  <text x="400" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="300" fill="#495057">Wires &amp; Cables</text>
</svg>