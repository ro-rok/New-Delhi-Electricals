<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)"/>
  <!-- Mounting boxes -->
  <rect x="220" y="120" width="160" height="160" rx="8" fill="#adb5bd" stroke="#868e96" stroke-width="2"/>
  <rect x="240" y="140" width="120" height="120" rx="4" fill="#dee2e6"/>
  <!-- Screw holes -->
  <circle cx="240" cy="140" r="4" fill="#868e96"/>
  <circle cx="360" cy="140" r="4" fill="#868e96"/>
  <circle cx="240" cy="260" r="4" fill="#868e96"/>
  <circle cx="360" cy="260" r="4" fill="#868e96"/>
  <!-- Box 2 - metal -->
  <rect x="420" y="120" width="160" height="160" rx="8" fill="#868e96" stroke="#495057" stroke-width="2"/>
  <rect x="440" y="140" width="120" height="120" rx="4" fill="#adb5bd"/>
  <circle cx="440" cy="140" r="4" fill="#495057"/>
  <circle cx="560" cy="140" r="4" fill="#495057"/>
  <circle cx="440" cy="260" r="4" fill="#495057"/>
  <circle cx="560" cy="260" r="4" fill="#495057"/>
  <!-- Box 3 - deep -->
  <rect x="320" y="320" width="160" height="180" rx="8" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/>
  <rect x="340" y="340" width="120" height="140" rx="4" fill="#f1f3f5"/>
  <circle cx="340" cy="340" r="4" fill="#868e96"/>
  <circle cx="460" cy="340" r="4" fill="#868e96"/>
  <circle cx="340" cy="460" r="4" fill="#868e96"/>
  <circle cx="460" cy="460" r="4" fill="#868e96"/>
  <text x="400" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="300" fill="#495057">Mounting Boxes</text>
</svg>